#-------------------------------
# Site Settings
title: VJs Mag
description: The press and media platform for live visual performances, VJ culture, and audiovisual art
logo: "/images/logo.svg"
logo_dark: "/images/logo-dark.svg"
color_scheme: dark


#-------------------------------
# Navigation Settings
menu_settings:
  menu_items:
    - title: "Home"
      url: "/"
    - title: "Latest"
      url: "/latest/"
    - title: "Authors"
      url: "/authors/"
    - title: "Videos"
      url: "/videos/"
    - title: "The Mag"
      submenu:
      - url: "/about/"
        title: "About"
      - url: "/partners/"
        title: "Partners"
      - url: "/advertise/"
        title: "Advertise"
      - url: "/documentation/"
        title: "Docs"
      - url: "/contact/"
        title: "Contact"

# Call to action button
cta_button:
  enable: true
  cta_button_link: '/submit/'
  cta_button_text: Submit News


#-------------------------------
# Hero Settings
hero:
  enable: true
  hero_title: Live Performance Press
  hero_description: News, reviews, interviews, and deep-dives into the world of live visual art and VJ culture.


#-------------------------------
# Tags Section Settings
tags_section:
  enable: true
  number_posts: 3
  number_columns: 3
  tags:
    - tag: "news"
    - tag: "spotlight"
    - tag: "trends"
    - tag: "technology"
    - tag: "tutorials"


#-------------------------------
# Authors Section Settings
authors_section:
  enable: true
  section_title: Meet our writers


#-------------------------------
# Footer Settings
footer_description: The press and media platform for live visual performances, VJ culture, and audiovisual art. Part of the VJs TV network.


# Social Links
social:
- {icon: "twitter", link: "https://twitter.com/vjsmag"}
- {icon: "facebook", link: "https://facebook.com/vjsmag"}
- {icon: "instagram", link: "https://instagram.com/vjsmag"}
- {icon: "discord", link: "https://discord.gg/Mnn6aVjvCZ"}
- {icon: "linkedin", link: "https://linkedin.com/company/vjsmag"}
- {icon: "youtube", link: "https://www.youtube.com/user/vjstv"}
- {icon: "vimeo", link: "https://vimeo.com/vjstv"}
- {icon: "rss", link: "https://www.vjsmag.com/feed"}


#-------------------------------
# Newsletter Settings
mailchimp_settings:
  enable: true
  mailchimp_title: Stay in the loop
  mailchimp_description: New articles, artist features & live performance coverage — straight to your inbox.
  mailchimp_identifier: https://vjsmag.us22.list-manage.com/subscribe?u=04b35b1905693c4daca7b592a&id=89e5d17e3e
  mailchimp_input_text: your@email.com
  mailchimp_button_text: Subscribe


#-------------------------------
# Contact Settings
contact:
  email: vjsmag@gmail.com
  description: We are always happy to hear from our customers, partners, and visitors. Whether you have a question, comment, suggestion, or just want to say hello, we are here to listen. Our dedicated team is ready to assist you with any inquiries or concerns you may have. Please don't hesitate to reach out to us using the form provided on this page, or through the contact information listed below. We look forward to connecting with you!


#-------------------------------
# Comment Section (Disqus)
disqus_identifier: anvod-studio-test


#-------------------------------
# Google Analytics
google_analytics:
